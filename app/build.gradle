plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bitcomputer'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// DESIGN.md 2.2 "최소 구성". 여기 없는 기술(Spring Session, Redis, Quartz, H2, Lombok, DevTools, Actuator)은 쓰지 않는다.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Windows의 Java 17은 기본 문자셋이 MS949라서, 지정하지 않으면 한글 주석·테스트 이름·메시지가 깨진다.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-Dfile.encoding=UTF-8'

    // 통합 테스트용 DB 접속 정보(TEST_DB_URL, TEST_DB_USERNAME, TEST_DB_PASSWORD).
    // 환경변수로 넘기거나, 저장소에서 제외된 app/test-db.local.properties에 적는다(예시: test-db.local.properties.example).
    // 비밀번호가 들어 있으므로 이 파일은 절대 커밋하지 않는다(.gitignore의 *.local.properties).
    def localDbConfig = file('test-db.local.properties')
    if (localDbConfig.exists()) {
        def props = new Properties()
        localDbConfig.withInputStream { props.load(it) }
        props.each { key, value -> environment(key.toString(), value.toString()) }
    }
}

tasks.named('bootRun') {
    jvmArgs '-Dfile.encoding=UTF-8'
}
