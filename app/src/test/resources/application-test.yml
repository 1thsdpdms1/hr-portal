# 통합 테스트 전용. 개발 DB(hr_portal)가 아니라 테스트 DB(hr_portal_test)에만 연결한다.
# 값은 환경변수 TEST_DB_URL / TEST_DB_USERNAME / TEST_DB_PASSWORD 또는
# app/test-db.local.properties(저장소 제외)에서 온다. build.gradle의 test 작업 참고.
spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}

# 테스트는 필요한 계정을 각자 만들고 롤백한다. 시작할 때 계정을 만들면 테스트 DB에 남는다.
seed:
  accounts:
    enabled: false

# 외부 API는 부르지 않는다. 워커 스케줄러를 끄고 테스트가 tick()을 직접 부른다(DESIGN.md 2.5.6).
bgcheck:
  base-url: http://127.0.0.1:1      # 실수로 실제 호출이 나가면 바로 실패하도록 닿지 않는 주소를 둔다
  candidate-key: test-key           # 실제 키가 아니다
  worker:
    enabled: false
