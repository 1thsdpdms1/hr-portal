# 비밀값(DB 비밀번호, CANDIDATE_KEY, 시드 계정 비밀번호)은 이 파일에 쓰지 않고 환경변수로만 받는다.
# IntelliJ 실행 구성에 환경변수를 넣는 방법은 DESIGN.md 부록 A.5 참고.
spring:
  application:
    name: hr-portal
  datasource:
    # 예: jdbc:mysql://localhost:3306/hr_portal?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    # connectionTimeZone/forceConnectionTimeZoneToSession: Java와 MySQL 사이의 시각을 UTC로 고정한다(DESIGN.md 2.3).
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none            # 테이블은 Flyway만 만든다(DESIGN.md 2.6)
    open-in-view: false         # 화면을 그리는 동안 DB 연결을 붙잡지 않는다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}   # 배포(HTTPS) 환경에서는 true
