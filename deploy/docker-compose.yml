# EC2 1대에 올리는 전체 구성(DEPLOY.md).
#   인터넷 → caddy(443, 자동 HTTPS) → app(8080) → mysql(3306, 내부 네트워크만)
#
# 앱 컨테이너는 반드시 1개만 띄운다. 로그인 세션이 앱 메모리에 있고, Background Check 워커도 하나여야 한다
# (여러 개가 돌면 같은 조회를 두 번 POST할 위험이 있다 — DESIGN.md 2.5).
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # 1GB 인스턴스라 기본값(버퍼풀 128M + performance_schema)보다 메모리를 아껴 쓴다.
    command: >
      --innodb-buffer-pool-size=192M
      --max-connections=50
      --performance-schema=OFF
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?deploy/.env 에 MYSQL_ROOT_PASSWORD 가 필요하다}"
      MYSQL_DATABASE: hr_portal
      MYSQL_USER: hr_app
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?deploy/.env 에 MYSQL_PASSWORD 가 필요하다}"
      TZ: UTC
    volumes:
      # 컨테이너를 다시 만들어도 데이터가 남는다.
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # 포트를 밖으로 열지 않는다. 같은 compose 네트워크의 app만 접근한다.
    networks: [internal]

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy   # Flyway가 DB 준비 전에 붙어 실패하지 않게 한다
    environment:
      # 앱은 모든 비밀값을 환경변수로만 받는다(저장소에 없다).
      DB_URL: "jdbc:mysql://mysql:3306/hr_portal?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8"
      DB_USERNAME: hr_app
      DB_PASSWORD: "${MYSQL_PASSWORD:?}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:?deploy/.env 에 관리자 초기 비밀번호가 필요하다}"
      SEED_EMPLOYEE_PASSWORD: "${SEED_EMPLOYEE_PASSWORD:?deploy/.env 에 직원 초기 비밀번호가 필요하다}"
      # 없으면 앱은 뜨지만 배경 조회가 '요청 대기'에서 멈춘다(로그와 화면에 경고가 나온다).
      CANDIDATE_KEY: "${CANDIDATE_KEY:-}"
      # HTTPS로 서비스하므로 세션 쿠키에 secure를 켠다.
      COOKIE_SECURE: "true"
      TZ: UTC
    healthcheck:
      # 로그인 화면은 인증 없이 열리므로 기동 확인에 쓴다(Actuator를 넣지 않는 대신).
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"     # Let's Encrypt 인증서 발급·갱신에 필요하다
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?deploy/.env 에 DOMAIN 이 필요하다. 예 my-hr-portal.duckdns.org}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # 발급받은 인증서. 지우면 재발급되므로 유지한다
      - caddy-config:/config
    networks: [internal]

volumes:
  mysql-data:
  caddy-data:
  caddy-config:

networks:
  internal:
